<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AimPoint Biomechanics — Launching</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #161B22;
      color: #E6EDF3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
      border: 1px solid #2A313C;
      border-radius: 12px;
    }
    .logo-ring {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 3px solid #2A313C;
      border-top-color: #2563EB;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
      color: #FFFFFF;
    }
    .subtitle {
      font-size: 11px;
      color: #94A3B8;
      font-family: monospace;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .status {
      font-size: 12px;
      color: #38BDF8;
      font-family: monospace;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10B981;
    }
  </style>
</head>
<body>
  <div class="logo-ring"></div>
  <h1 class="title">AimPoint Biomechanics</h1>
  <p class="subtitle">Sagittal Angle &amp; Motion Analysis Workstation</p>
  <div class="status">
    <div class="status-dot"></div>
    <span id="statusText">Starting Biomechanical Analysis Engine...</span>
  </div>
</body>
</html>
